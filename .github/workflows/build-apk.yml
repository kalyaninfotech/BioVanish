name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip and Build
        run: |
          ls -la
          unzip -o BioVanish-Android-Project.zip
          echo "After unzip:"
          ls -la
          find . -name "gradlew" -type f
          PROJECT_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "Project dir is $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
