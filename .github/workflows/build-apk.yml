name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o BioVanish-Android-Project.zip
          ls -R
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          cd BioVanish-Android-Project
          chmod +x./gradlew
         ./gradlew assembleRelease -Pandroid.injected.signing.store.file=my-release-key.jks -Pandroid.injected.signing.store.password=Bio@12345 -Pandroid.injected.signing.key.alias=biovanish -Pandroid.injected.signing.key.password=Bio@12345
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: [STRIPPED 67 bytes].apk
