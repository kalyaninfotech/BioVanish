name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip and Build APK
        run: |
          ls -la
          unzip -o BioVanish-Android-Project.zip
          echo "=== After unzip ==="
          ls -la
          PROJECT_DIR=$(find . -maxdepth 4 -name gradlew -type f | head -n 1 | xargs dirname)
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BioVanish-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
