name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          set -x
          ls -la
          echo "Unzipping..."
          unzip -o BioVanish-Android-Project.zip
          ls -la
          echo "Finding gradlew..."
          find . -maxdepth 4 -name gradlew -type f
          PROJECT_DIR=$(find . -maxdepth 4 -name gradlew -type f -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "gradlew not found!"
            exit 1
          fi
          echo "Found project at $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
