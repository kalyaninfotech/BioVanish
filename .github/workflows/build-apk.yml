name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip and Build APK
        run: |
          ls -lh
          echo "Unzipping..."
          unzip -o BioVanish-Android-Project.zip
          echo "After unzip:"
          ls -lh
          PROJECT_DIR=$(find . -maxdepth 4 -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "Found project at: $PROJECT_DIR"
          if [ -z "$PROJECT_DIR" ]; then
            echo "gradlew not found, listing all:"
            find . -type f | head -n 50
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BioVanish-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
